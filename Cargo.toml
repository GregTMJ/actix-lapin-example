[package]
name = "actix-lapin"
version = "1.0.0"
edition = "2024"

[dependencies]
actix-rt = "2.11.0"
actix-web = "4.13.0"
chrono = "0.4.44"
dotenvy = "0.15.7"
env_logger = "0.11.10"
envconfig = "0.11.1"
lapin = "4.12.3"
log = "0.4.29"
serde = "1.0.228"
serde_json = "1.0.149"
thiserror = "2.0.18"
tokio = { version = "1.52.1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-stream = "0.1.18"
uuid = { version = "1.23.1", features = ["serde", "v4"] }

[profile.dev]
opt-level = 0
debug = "line-tables-only"
incremental = true

[profile.dev.package."*"]
debug = false

[profile.release]
opt-level = 3
debug = 0
strip = "debuginfo"
lto = "thin"
panic = "unwind"
incremental = false
codegen-units = 16

[profile.debugging]
inherits = "dev"
debug = 2

[profile.debugging.package."*"]
debug = 2
